<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Validar Cupom | Imagine</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBEBEB;--green:#08F868;--dark:#4E4E4E;--white:#FFFFFF;--gold:#fbbf24;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Bebas Neue',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;}
.card{background:var(--white);border:3px solid var(--green);border-radius:24px;padding:2rem;max-width:460px;width:100%;font-family:'Outfit',sans-serif;}
h1{font-size:1.8rem;font-family:'Bebas Neue',sans-serif;color:var(--green);margin-bottom:.25rem;letter-spacing:1px;}
.subtitle{color:var(--dark);opacity:0.6;font-size:.85rem;margin-bottom:1.5rem;}
.field{margin-bottom:1rem;}
label{display:block;font-size:.8rem;color:var(--dark);opacity:0.8;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em;}
input{width:100%;background:var(--white);border:2px solid rgba(78,78,78,0.2);border-radius:12px;padding:.85rem 1rem;color:var(--dark);font-family:'Outfit',sans-serif;font-size:1rem;outline:none;transition:.2s;}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(8,248,104,.2);}
.btn{width:100%;padding:1rem;border:none;border-radius:12px;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:1px;cursor:pointer;transition:.2s;background:var(--green);color:var(--dark);margin-top:.5rem;}
.btn:hover{transform:scale(1.02);box-shadow:0 0 25px rgba(8,248,104,.5);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;}
.result-box{margin-top:1.5rem;background:var(--white);border:2px solid rgba(78,78,78,0.1);border-radius:16px;padding:1.5rem;display:none;}
.result-box.visible{display:block;}
.status-badge{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem 1.2rem;border-radius:50px;font-weight:700;font-size:.9rem;margin-bottom:1rem;}
.active{background:rgba(8,248,104,.15);border:2px solid var(--green);color:var(--green);}
.used{background:rgba(255,100,100,.1);border:2px solid #ff6464;color:#ff6464;}
.meta{display:flex;justify-content:space-between;padding:.35rem 0;font-size:.9rem;border-bottom:1px dashed rgba(78,78,78,.15);}
.meta:last-child{border-bottom:none;}
.meta-label{color:var(--dark);opacity:0.6;}
.meta-value{font-weight:700;}
.msg{margin-top:1rem;padding:.75rem 1rem;border-radius:12px;font-size:.9rem;display:none;}
.msg.visible{display:block;}
.msg.success{background:rgba(8,248,104,.15);border:1px solid var(--green);color:var(--green);}
.msg.error{background:rgba(255,100,100,.1);border:1px solid #ff6464;color:#ff6464;}
#loginSection{display:block;}#mainSection{display:none;}
.logo-text{font-size:1.8rem;font-family:'Bebas Neue',sans-serif;color:var(--dark);letter-spacing:2px;display:block;text-align:center;margin-bottom:1.5rem;}
</style>
</head>
<body>
<div class="card">
  <span class="logo-text">
    <img src="logoVerde3.0.png" alt="Imagine" style="height:40px; vertical-align:middle; filter:drop-shadow(0 0 8px rgba(8,248,104,0.4)); margin-right:8px;" onerror="this.style.display='none'">
    ADMIN
  </span>

  <!-- LOGIN -->
  <div id="loginSection">
    <h1>🔐 Acesso Restrito</h1>
    <p class="subtitle">Área exclusiva para validação de cupons</p>
    <div class="field">
      <label>Senha administrativa</label>
      <input type="password" id="adminPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" onclick="doLogin()">Entrar</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- MAIN -->
  <div id="mainSection">
    <h1>🎟️ Validar Cupom</h1>
    <p class="subtitle">Busque o cupom pelo código ou escaneie o QR Code</p>
    <div class="field">
      <label>Código do Cupom</label>
      <input type="text" id="couponInput" placeholder="#XXXXXX" style="text-transform:uppercase;" onkeydown="if(event.key==='Enter')searchCoupon()">
    </div>
    <button class="btn" id="searchBtn" onclick="searchCoupon()">🔍 Buscar Cupom</button>

    <div class="result-box" id="resultBox">
      <div id="statusBadge" class="status-badge"></div>
      <div id="couponDetails"></div>
      <button class="btn btn-danger" id="useBtn" onclick="useCoupon()" style="margin-top:1rem;display:none;">✓ Marcar Como Utilizado</button>
    </div>
    <div class="msg" id="actionMsg"></div>
    <hr style="border:none;border-top:1px dashed rgba(78,78,78,.15);margin:1.5rem 0;">
    <button class="btn" onclick="logout()" style="background:var(--white);border:2px solid var(--dark);color:var(--dark);">Sair</button>
  </div>
</div>

<script>
const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbyOP2oWd-ievs1pwG0xk_OIyfLUj3-Hm-n20e9jKrIj5mVjeTy-du90ncSjxkoeq-gg/exec',
  ADMIN_PASSWORD: 'imagine2024', // Mude para sua senha
};

const PRIZE_ICONS = { desconto5:'🏷️', desconto10:'🏷️', desconto15:'🏷️', desconto25:'🏷️', chaveiro:'🔑', desconto50:'⭐' };
let currentCoupon = null;

function doLogin(){
  const pass = document.getElementById('adminPass').value;
  const msg = document.getElementById('loginMsg');
  if(pass === CONFIG.ADMIN_PASSWORD){
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('mainSection').style.display = 'block';
    showMsg(msg,'','');
  } else {
    showMsg(msg,'error','❌ Senha incorreta');
  }
}

function logout(){
  document.getElementById('loginSection').style.display = 'block';
  document.getElementById('mainSection').style.display = 'none';
  document.getElementById('adminPass').value = '';
  document.getElementById('resultBox').classList.remove('visible');
}

async function searchCoupon(){
  const id = document.getElementById('couponInput').value.trim().toUpperCase();
  if(!id){ alert('Digite o código do cupom'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.textContent = '⏳ Buscando...';

  const resultBox = document.getElementById('resultBox');
  const actionMsg = document.getElementById('actionMsg');
  showMsg(actionMsg,'','');

  try {
    let data;
    if(CONFIG.APPS_SCRIPT_URL === 'SUA_URL_DO_APPS_SCRIPT_AQUI'){
      // Demo mode
      data = { id, prize:'desconto10', prizeLabel:'10% de Desconto', date: new Date().toISOString(), status:'ATIVO' };
    } else {
      const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=get&id=${encodeURIComponent(id)}`);
      data = await res.json();
    }

    if(data.error){ showError(data.error); }
    else { showResult(data); }
  } catch(e){ showError('Erro de conexão com o servidor.'); }

  btn.disabled = false; btn.textContent = '🔍 Buscar Cupom';
}

function showResult(c){
  currentCoupon = c;
  const isUsed = c.status === 'USADO';
  const icon = PRIZE_ICONS[c.prize] || '🎁';
  const badge = document.getElementById('statusBadge');
  badge.className = 'status-badge ' + (isUsed ? 'used' : 'active');
  badge.textContent = isUsed ? '✕ Cupom Utilizado' : '✓ Cupom Válido';

  document.getElementById('couponDetails').innerHTML = `
    <div class="meta"><span class="meta-label">Código</span><span class="meta-value" style="letter-spacing:.08em;color:var(--gold);">${c.id}</span></div>
    <div class="meta"><span class="meta-label">Prêmio</span><span class="meta-value">${icon} ${c.prizeLabel || c.prize}</span></div>
    <div class="meta"><span class="meta-label">Emitido em</span><span class="meta-value">${c.date ? new Date(c.date).toLocaleDateString('pt-BR') : '—'}</span></div>
    <div class="meta"><span class="meta-label">Status</span><span class="meta-value">${c.status}</span></div>
    ${isUsed && c.usedDate ? `<div class="meta"><span class="meta-label">Usado em</span><span class="meta-value">${new Date(c.usedDate).toLocaleDateString('pt-BR')}</span></div>` : ''}
  `;

  const useBtn = document.getElementById('useBtn');
  useBtn.style.display = isUsed ? 'none' : 'block';
  document.getElementById('resultBox').classList.add('visible');
}

async function useCoupon(){
  if(!currentCoupon) return;
  if(!confirm(`Marcar o cupom ${currentCoupon.id} como utilizado?\n\nEsta ação não pode ser desfeita.`)) return;

  const btn = document.getElementById('useBtn');
  btn.disabled = true; btn.textContent = '⏳ Processando...';
  const actionMsg = document.getElementById('actionMsg');

  try {
    if(CONFIG.APPS_SCRIPT_URL.includes('SUA_URL')){
      showMsg(actionMsg,'success','✅ (Modo Teste) Cupom marcado como utilizado com sucesso!');
      currentCoupon.status = 'USADO';
      currentCoupon.usedDate = new Date().toISOString();
      showResult(currentCoupon);
    } else {
      const url = `${CONFIG.APPS_SCRIPT_URL}?action=use&id=${encodeURIComponent(currentCoupon.id)}&password=${encodeURIComponent(CONFIG.ADMIN_PASSWORD)}`;
      await fetch(url, { mode: 'no-cors' });
      
      // Assumimos sucesso porque no-cors não permite ler a resposta
      showMsg(actionMsg,'success','✅ Cupom marcado como utilizado com sucesso!');
      currentCoupon.status = 'USADO';
      currentCoupon.usedDate = new Date().toISOString();
      showResult(currentCoupon);
    }
  } catch(e){ showMsg(actionMsg,'error','❌ Erro de conexão com o servidor.'); }

  btn.disabled = false;
}

function showError(msg){ document.getElementById('resultBox').innerHTML=`<p style="color:#ff6464;">❌ ${msg}</p>`; document.getElementById('resultBox').classList.add('visible'); }
function showMsg(el, type, text){ el.className = 'msg' + (type ? ' ' + type : ''); el.textContent = text; if(text) el.classList.add('visible'); else el.classList.remove('visible'); }
</script>
</body>
</html>
